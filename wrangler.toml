# Cloudflare Worker for "Ask Newborough Warren". See README.md for setup.
name = "nrg-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# The site the chat page is served from. Requests from anywhere else are refused.
ALLOWED_ORIGINS = "https://newbroman.github.io"
# Rules, tool definitions, model and limits: built in Newborough_Hydrology by
# tools/build_chat_corpus.py and published with the site.
CONFIG_URL = "https://newbroman.github.io/Newborough_Hydrology/chat/chat_config.json"
MONTHLY_CAP_GBP = "10"
# Conversion for the cap; review against the Anthropic invoice.
GBP_PER_USD = "0.80"
RATE_PER_HOUR = "5"
# Questions per visitor per day (resets 00:00 UTC). At the limit the page offers the Claude version (D-247).
RATE_PER_DAY = "5"
# Feedback notes per visitor per day (D-248).
FEEDBACK_PER_DAY = "5"
RETENTION_DAYS = "365"
# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   ANTHROPIC_API_KEY   the Claude API key
#   IP_SALT             any long random string; makes the rate-limit hashes unlinkable

[[d1_databases]]
binding = "DB"
database_name = "nrg-chat"
database_id = "2c4be5ae-d144-4581-b509-b5a160b00cd9"

[triggers]
# Daily retention sweep, 03:17 UTC.
crons = ["17 3 * * *"]
